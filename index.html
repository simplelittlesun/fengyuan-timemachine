<style>
:root{--sky1:#CFE6E3;--sky2:#EFE8D6;--ink:#24343A;--ink-2:#5A6B70;--paper:#FFFDF6;--paper-2:#F5F0E3;--line:rgba(36,52,58,.12);--pill:#FFFFFF;--pill-on:#24343A;--pill-on-ink:#FFFDF6;--scrim:rgba(20,40,44,.35);--accent:#E3A33B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#18303A;--sky2:#26302C;--ink:#EAF1EE;--ink-2:#A9BAB6;--paper:#1F2E33;--paper-2:#26383E;--line:rgba(234,241,238,.14);--pill:#25373D;--pill-on:#E3A33B;--pill-on-ink:#1A1A1A;--scrim:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#18303A;--sky2:#26302C;--ink:#EAF1EE;--ink-2:#A9BAB6;--paper:#1F2E33;--paper-2:#26383E;--line:rgba(234,241,238,.14);--pill:#25373D;--pill-on:#E3A33B;--pill-on-ink:#1A1A1A;--scrim:rgba(0,0,0,.5);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
header{padding:14px 16px 0 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{white-space:nowrap;font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:clamp(22px,6.6vw,29px);letter-spacing:.04em;margin:0;line-height:1.1}
.sub{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.hb{display:flex;gap:6px;flex:none}.btn{flex:none;border:1px solid var(--line);background:var(--pill);color:var(--ink);border-radius:999px;padding:7px 11px;font-size:12.5px;font-family:inherit;cursor:pointer}
.strip{margin:8px 12px 0;display:flex;align-items:center;gap:10px;border:none;background:var(--accent);color:#24343A;border-radius:14px;padding:9px 14px;font-family:inherit;cursor:pointer;text-align:left}
.strip .sl{font-family:"Huninn","Noto Sans TC",sans-serif;font-size:13px;flex:none;background:rgba(255,253,246,.55);border-radius:999px;padding:3px 9px}
.strip .sv{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .35s}
.strip .sm{flex:none;font-size:12px}
.mode{display:flex;margin:6px 12px 0;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}.mode button{flex:1;border:none;background:transparent;color:var(--ink-2);border-radius:999px;padding:5px 0;font-family:"Huninn","Noto Sans TC",sans-serif;font-size:15px;cursor:pointer}.mode button[aria-selected="true"]{background:var(--pill-on);color:var(--pill-on-ink)}
.t3{background:#E4E0F2;color:#4A3F7A}.story h3 small.loc{background:#FFF4DE;color:#7A4E0E;border-radius:6px;padding:1px 6px}
.board{position:relative;flex:1;min-height:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
.lbl{position:absolute;left:0;top:0;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-family:"Huninn","Noto Sans TC",sans-serif;font-size:12.5px;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);will-change:transform}
.lbl.food{background:#FFF4DE;color:#5A3A10;border-color:rgba(227,163,59,.5)}
.lbl.sel{background:var(--accent);color:#24343A;border-color:var(--accent)}.lbl.cap{pointer-events:none!important;font-size:13px;background:var(--paper);color:var(--ink)}
.cam{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.cam button,.foodbtn{border:1px solid var(--line);background:var(--pill);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-family:inherit;cursor:pointer}
.foodbtn{position:absolute;left:10px;bottom:10px}
.foodbtn[aria-pressed="true"]{background:var(--accent);color:#24343A;border-color:var(--accent)}
.pop{position:absolute;z-index:5;width:230px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;box-shadow:0 6px 20px rgba(20,40,44,.18);display:none}
.pop.open{display:block}
.pop .tag{font-size:11px;color:var(--ink-2)}
.pop h4{margin:2px 0 4px;font-size:15px}
.pop p{margin:0;font-size:13px;line-height:1.6}
.sheet{margin:6px 10px 0;background:var(--paper);border-radius:20px 20px 16px 16px;padding:2px 0 10px;border:1px solid var(--line);position:relative}
.grab{display:block;width:100%;border:none;background:transparent;padding:6px 0 4px;cursor:pointer}.grab span{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet.collapsed{padding-bottom:8px}
.sheet.collapsed .story{min-height:0;grid-template-columns:44px 1fr;padding:8px 10px;gap:0 10px;align-items:center}
.sheet.collapsed .story .ic{width:44px;height:44px;grid-row:span 2}
.sheet.collapsed .story h3{margin:0;font-size:14.5px}
.sheet.collapsed .story p{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink-2)}
.sheet.collapsed .story .emo{font-size:24px}
.eh{padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.ehl{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.eh .yr{font-size:12px;color:var(--ink-2);margin:0}
.eh h2{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:17px;margin:0;line-height:1.25}
.stories{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 2px;scroll-padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.stories::-webkit-scrollbar{display:none}
.story{cursor:pointer;flex:0 0 100%;min-height:96px;scroll-snap-align:start;background:var(--paper-2);border-radius:14px;padding:10px 12px 12px 8px;display:grid;grid-template-columns:62px 1fr;gap:2px 8px;align-content:start;border:1.5px solid transparent;transition:border-color .3s}
.story.hi{border-color:var(--accent)}
.story .ic{grid-row:span 2;width:62px;height:62px;border-radius:12px;object-fit:cover}
.story .emo{display:flex;align-items:center;justify-content:center;font-size:34px;background:#FFF4DE;border:2px solid #E3A33B}
.stories{transition:height .25s}
.story h3{margin:4px 0 0;font-size:15px;font-weight:700;line-height:1.35}
.story h3 small{font-weight:400;font-size:11px;color:var(--ink-2);margin-left:6px}
.story p{margin:0;font-size:13.5px;line-height:1.65}
.dots{display:flex;align-items:center;gap:6px;flex:none;margin:0}.dots button{border:1px solid var(--line);background:var(--pill);color:var(--ink);border-radius:999px;width:32px;height:28px;font-size:15px;cursor:pointer;line-height:1}.dots button:disabled{opacity:.3;cursor:default}.dots span{font-size:12px;color:var(--ink-2)}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink-2)}
nav{display:flex;gap:4px;padding:8px 10px 12px}
:root.nl nav{padding-bottom:66px}
nav button{flex:1;min-width:0;border:1px solid var(--line);background:var(--pill);color:var(--ink);border-radius:999px;padding:6px 0 5px;font-family:"Huninn","Noto Sans TC",sans-serif;font-size:14.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
nav button small{font-family:"Noto Sans TC",sans-serif;font-size:9px;color:var(--ink-2)}
nav button[aria-pressed="true"]{background:var(--pill-on);color:var(--pill-on-ink);border-color:var(--pill-on)}
nav button[aria-pressed="true"] small{color:inherit;opacity:.8}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:20}
.panel.open{display:flex}
.pbody{background:var(--paper);width:100%;max-width:600px;max-height:84%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.pbody h2{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:22px;margin:0 0 4px}
.pbody .lead{font-size:13px;color:var(--ink-2);margin:0 0 14px;line-height:1.6}
.pbody h3{font-size:14px;margin:16px 0 6px;font-weight:700}
.pbody ul{list-style:none;margin:0;padding:0}
.pbody li{font-size:13.5px;line-height:1.55;padding:7px 0;border-top:1px solid var(--line)}
.pbody li a{color:var(--ink);text-underline-offset:3px}
.tg{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.t1{background:#DCEBD3;color:#2F5A22}.t2{background:#F3E3C6;color:#7A4E0E}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--paper-2);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:21px;line-height:1.2;margin-bottom:4px}
.stat span{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.maps{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin:4px 0 12px}.maps svg{width:100%;height:auto}.twmap .co{fill:var(--paper-2);stroke:var(--ink-2);stroke-width:.4;stroke-opacity:.5}.twmap .tc{fill:#CFE0B8;stroke:var(--ink-2);stroke-width:.4}.twmap .fy,.tcmap .fy{fill:#E3A33B;stroke:#A86E14;stroke-width:.6}.ping{fill:none;stroke:#E3A33B;stroke-width:1.5}.tcmap .tw{fill:var(--paper-2);stroke:var(--ink-2);stroke-width:.5;stroke-opacity:.5}.tcmap text{font-size:11px;fill:var(--ink-2);font-family:"Noto Sans TC",sans-serif}.tcmap .lbf{font-size:13px;font-weight:700;fill:var(--ink)}.go{display:block;width:100%;margin-top:14px;border:none;background:var(--pill-on);color:var(--pill-on-ink);border-radius:999px;padding:12px;font-family:"Huninn","Noto Sans TC",sans-serif;font-size:16px;cursor:pointer}
.geo{display:grid;gap:8px}
.geo div{background:var(--paper-2);border-radius:14px;padding:12px 14px}
.geo b{display:block;font-size:14.5px;margin-bottom:3px}
.geo span{font-size:13px;line-height:1.65}
.close{float:right;border:none;background:var(--paper-2);color:var(--ink);border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer}
.qbtn{width:32px;padding:7px 0;text-align:center;font-weight:700}
.tour{position:fixed;inset:0;z-index:30;display:none}
.tour.open{display:block}
.tour .hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(15,30,34,.62);transition:all .35s cubic-bezier(.3,1,.4,1);pointer-events:none;outline:2px solid #E3A33B;outline-offset:2px}
.tour .tip{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:top .35s}
.tour .tip .st{font-size:11.5px;color:var(--ink-2)}
.tour .tip p{margin:4px 0 10px;font-size:15px;line-height:1.65}
.tour .tip .row{display:flex;justify-content:space-between;align-items:center}
.tour .tip button{border:none;border-radius:999px;padding:8px 16px;font-family:inherit;font-size:14px;cursor:pointer}
.tour .skip{background:transparent;color:var(--ink-2)}
.tour .next{background:var(--pill-on);color:var(--pill-on-ink)}
@media (prefers-reduced-motion:reduce){.tour .hole,.tour .tip{transition:none}}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2)}
</style>
</head>

<div class="app">
<header><div><h1>豐原時光機</h1></div><div class="hb"><button class="btn" id="help">導覽</button><button class="btn" id="openWhere">豐原在哪</button><button class="btn" id="openSrc">資料來源</button></div></header>

</div>

<h2 id="ptitle">資料來源</h2>
<p class="lead">地圖輪廓為豐原區實際邊界，地標依實際座標擺放，太擠時會稍微推開。標示「一手」的是政府機關或學校資料；「媒體」是新聞、專題或網路文章；「口述」是在地居民提供、網路上查不到可靠資料的店家，正式版建議再對照《臺中縣志》等出版品確認。</p>

</div></div>

function resize(){wake();const w=board.clientWidth,h=board.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(window.__fyOK){renderer.render(scene,camera)}LABELS.forEach(L=>{L.w=L.el.offsetWidth;L.h=L.el.offsetHeight})}
new ResizeObserver(resize).observe(board);
camera.position.set(10,30,34);controls.target.set(0,.6,0);
TILES.forEach(T=>{T.goal=tileH(T,0);setTile(T,T.goal)});
resize();setEra(0);window.__fyOK=true;document.getElementById('loading').remove();
try{if(!localStorage.getItem('fy-seen-where')){document.getElementById('wherep').classList.add('open');localStorage.setItem('fy-seen-where','1')}}catch(e){document.getElementById('wherep').classList.add('open')}
const clock=new THREE.Clock();document.addEventListener('visibilitychange',wake);addEventListener('focus',wake);['pointerdown','wheel','keydown','touchstart'].forEach(ev=>addEventListener(ev,wake,{passive:true}));controls.addEventListener('change',wake);
function loop(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 TILES.forEach(T=>{if(Math.abs(T.cur-T.goal)>.001)setTile(T,RM?T.goal:T.cur+(T.goal-T.cur)*Math.min(1,dt*2.5))});
 PLACED.forEach(p=>{p.g.position.y=p.tile.cur+.1});FOODOBJ.forEach(o=>{o.g.position.y=o.tile.cur+.1});
 if(shake>0){shake=Math.max(0,shake-dt);scene.position.x=Math.sin(t*55)*.12*Math.min(1,shake);scene.position.z=Math.cos(t*47)*.09*Math.min(1,shake)}else scene.position.set(0,0,0);
 GT.x+=(GT.tx-GT.x)*Math.min(1,dt*4);GT.z+=(GT.tz-GT.z)*Math.min(1,dt*4);gourd.position.set(GT.x,GT.tile.cur+.1+(RM?0:Math.abs(Math.sin(t*3))*.12),GT.z);gourd.rotation.y=Math.atan2(camera.position.x-GT.x,camera.position.z-GT.z);
 if(ringT>=0){ringT+=dt;const k=ringT/1.2;ring.scale.setScalar(.5+k*1.8);ring.material.opacity=Math.max(0,.9*(1-k));if(k>=1)ringT=-1}
 if(camTw){const k=Math.min(1,(performance.now()-camTw.s)/750),e=1-Math.pow(1-k,3);controls.target.lerpVectors(camTw.t0,camTw.t1,e);camera.position.lerpVectors(camTw.p0,camTw.p1,e);if(k>=1)camTw=null}
 controls.update();sun.target.position.copy(controls.target);sun.position.copy(controls.target).add(new THREE.Vector3(14,26,10));
 const busy=camTw||ringT>=0||shake>0||TILES.some(T=>Math.abs(T.cur-T.goal)>.001)||Math.abs(GT.tx-GT.x)+Math.abs(GT.tz-GT.z)>.01;if(busy)wake();
 if(performance.now()-ACTIVE<4000){renderer.render(scene,camera);updateLabels()}requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',()=>{camTw=null});
loop();
</script>
</body>
